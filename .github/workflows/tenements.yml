# Mine properties: registered production leases around each mine site (free state registers). Daily + by hand.
name: Mine properties
on:
  schedule:
    - cron: "40 19 * * *"   # daily, 3:40am Perth
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: tenements, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q shapely pyshp
      - run: python scripts/tenements.py
      - name: Publish
        run: |
          git config user.name "mines-map-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/tenements.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Mine properties (lease outlines) updated"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 8; done
