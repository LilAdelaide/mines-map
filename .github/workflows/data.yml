# Free live data for the Mines Map. Runs on GitHub's servers; no Claude subscription needed.
name: Live data
on:
  schedule:
    - cron: "*/15 22-23 * * 0-4"   # ASX open (Sydney 9am-11am, UTC evening before) — prices + announcements
    - cron: "*/15 0-6 * * 1-5"     # ASX trading day (UTC 00:00–06:59)
    - cron: "5 * * * *"            # hourly — commodity prices
    - cron: "20,50 * * * *"        # twice an hour — headlines and drivers
    - cron: "40 6,7 * * 1-5"       # after the ASX close — 52-week ranges, volumes, yields, daily price history
    - cron: "15 10 * * 1-5"        # evening — gold costs (AISC) and calendar
  workflow_dispatch:
    inputs:
      job:
        description: "Which job (all, prices, commod, news, stats, costs)"
        default: all
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pick jobs
        id: pick
        run: |
          S="${{ github.event.schedule }}"; J="${{ github.event.inputs.job }}"
          run() { echo "$1=true" >> "$GITHUB_OUTPUT"; }
          if [ "$J" = "all" ] || [ -z "$S$J" ]; then run prices; run commod; run news; run stats; run costs; fi
          [ "$J" != "" ] && [ "$J" != "all" ] && run "$J"
          case "$S" in
            "*/15 22-23 * * 0-4"|"*/15 0-6 * * 1-5") run prices ;;
            "5 * * * *") run commod ;;
            "20,50 * * * *") run news ;;
            "40 6,7 * * 1-5") run stats ;;
            "15 10 * * 1-5") run costs ;;
          esac
      - if: steps.pick.outputs.prices == 'true'
        run: python scripts/prices.py
      - if: steps.pick.outputs.commod == 'true'
        run: python scripts/commod.py
      - if: steps.pick.outputs.news == 'true'
        run: python scripts/news.py
      - if: steps.pick.outputs.stats == 'true'
        run: python scripts/stats.py
      - if: steps.pick.outputs.costs == 'true'
        run: pip install -q pypdf && python scripts/costs.py
      - name: Publish data
        run: |
          git config user.name "mines-map-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
